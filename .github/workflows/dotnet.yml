name: .NET

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build OpenCatasharpData.slnx --configuration Release
      - name: Smoke tests
        run: dotnet run --project tests/OpenCatasharpData.SmokeTests --configuration Release
